name: Propose a piece
description: A unit adopted after a project already exists
title: "piece: "
labels: ["piece", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        A piece is for something you decide **later** — auth, an audit trail,
        a CRUD entity. If it belongs in every project from the start, it is a
        feature of the form instead.

  - type: input
    id: what
    attributes:
      label: What does it add?
      placeholder: "Rate limiting — token bucket middleware with per-key limits"
    validations:
      required: true

  - type: input
    id: applies
    attributes:
      label: Which templates can adopt it?
      description: Template names, or "any" for a universal common piece.
      placeholder: "go-http-service, go-rest-sqlite"
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: What does it add, and what does it touch?
      description: >
        A piece may only add files that do not already exist, and may only
        touch shared files through declared patches. If it needs wiring inside
        existing code, say which socket the form would have to expose.
      placeholder: |
        adds:    internal/middleware/ratelimit.go, its test
        patches: internal/api/mux.go — registers the middleware
    validations:
      required: true

  - type: checkboxes
    id: bar
    attributes:
      label: The bar
      options:
        - label: It adds only new files, and touches shared ones only through patches
          required: true
        - label: The result still builds and its tests pass after adoption
          required: true
